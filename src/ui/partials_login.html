<div class="min-h-screen flex items-center justify-center px-4 py-10" x-show="!token" x-cloak>
  <div class="w-full max-w-[360px]">

    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl mb-3" style="background-color: var(--accent);">
        <i class="fa-solid fa-screwdriver-wrench text-white text-lg"></i>
      </div>
      <h1 class="text-lg font-semibold">MB T-CASE</h1>
      <p class="text-xs text-slate-500 mt-1">Technical Case Escalation &amp; Management System</p>
    </div>

    <form @submit.prevent="submitLogin()" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">

      <div>
        <label for="login-email" class="block text-xs font-medium text-slate-600 mb-1">Email</label>
        <input id="login-email" type="email" x-model="loginForm.email" required autocomplete="username"
               class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2"
               style="--tw-ring-color: var(--accent);"
               placeholder="nama@domain.co.id">
      </div>

      <div>
        <label for="login-pin" class="block text-xs font-medium text-slate-600 mb-1">PIN (6 digit)</label>
        <input id="login-pin" type="password" inputmode="numeric" pattern="\d{6}" maxlength="6"
               x-model="loginForm.pin" required autocomplete="current-password"
               class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm tracking-[0.3em] focus:outline-none focus:ring-2"
               style="--tw-ring-color: var(--accent);"
               placeholder="••••••">
      </div>

      <p class="text-xs text-red-600" x-show="loginForm.error" x-text="loginForm.error" x-cloak></p>

      <button type="submit" :disabled="loginForm.loading"
              class="btn-primary w-full rounded-lg py-2.5 text-sm font-medium transition">
        <span x-show="!loginForm.loading">Masuk</span>
        <span x-show="loginForm.loading" x-cloak><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memeriksa…</span>
      </button>

    </form>

    <p class="text-center text-[11px] text-slate-400 mt-4">
      Lupa PIN? Hubungi IIDI Technical Manager di dealer/area Anda.
    </p>
  </div>
</div>
