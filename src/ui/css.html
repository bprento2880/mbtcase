<!--
  CDN di-pin ke versi tetap (bukan "latest") sesuai CLAUDE.md §8.
  Kalau perlu upgrade, ganti nomor versi di sini secara sadar, jangan biarkan mengambang.
-->
<script src="https://cdn.tailwindcss.com/3.4.13"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
  /* Satu warna aksen saja untuk aksi utama (CLAUDE.md §8). Warna lain hanya untuk
     makna: hijau/kuning/merah khusus status SLA. */
  :root {
    --accent: #1b3a6b;      /* biru Mercedes-Benz tua — aksi utama */
    --accent-hover: #142c52;
    --sla-on-time: #10b981; /* hijau */
    --sla-near-due: #f59e0b;/* kuning */
    --sla-overdue: #ef4444; /* merah */
    --sla-none: #9ca3af;    /* abu-abu */
  }

  /* x-cloak hanya berlaku selama Alpine BELUM siap. Kalau CDN gagal, kelas
     .alpine-dead dipasang watchdog di Index.html dan x-cloak dinetralkan,
     supaya kegagalan CDN tidak pernah lagi jadi layar putih total. */
  [x-cloak] { display: none !important; }
  body.alpine-dead [x-cloak] { display: revert !important; }
  #boot-error { display: none; }
  body.alpine-dead #boot-error { display: block; }

  .btn-primary {
    background-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background-color: var(--accent-hover); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

  .badge-sla-on-time   { background-color: color-mix(in srgb, var(--sla-on-time) 15%, white);  color: var(--sla-on-time); }
  .badge-sla-near-due  { background-color: color-mix(in srgb, var(--sla-near-due) 15%, white); color: var(--sla-near-due); }
  .badge-sla-overdue   { background-color: color-mix(in srgb, var(--sla-overdue) 15%, white);  color: var(--sla-overdue); }
  .badge-sla-none      { background-color: color-mix(in srgb, var(--sla-none) 15%, white);     color: var(--sla-none); }

  /* Kelas berulang untuk tabel & navigasi. Ditulis sekali di sini supaya
     partial tidak dipenuhi rantai utility yang sama berulang-ulang. */
  .th { padding: .625rem 1rem; font-weight: 500; font-size: 12px; }
  .td { padding: .625rem 1rem; }

  .nav-link {
    height: 2rem; padding: 0 .75rem; border-radius: .5rem;
    font-size: 13px; font-weight: 500; color: #475569;
    transition: background-color .15s, color .15s;
  }
  .nav-link:hover { background: #f1f5f9; }
  .nav-link-on { color: var(--accent); background: #f1f5f9; }

  .tabbar-btn {
    display: flex; flex-direction: column; align-items: center; gap: .1875rem;
    padding: .5rem 0 .625rem; font-size: 11px; font-weight: 500; color: #64748b;
  }
  .tabbar-btn-on { color: var(--accent); }

  .pager {
    width: 2rem; height: 2rem; border-radius: .5rem; color: #475569;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .15s;
  }
  .pager:hover:not(:disabled) { background: #f1f5f9; }
  .pager:disabled { opacity: .35; cursor: not-allowed; }

  /* Chip filter boleh di-scroll, tapi scrollbar-nya jangan kelihatan. */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  body { background: #f8fafc; -webkit-font-smoothing: antialiased; }
  /* Skeleton loader (dipakai mulai Fase 8 dashboard) — bukan spinner layar penuh. */
  .skeleton {
    background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 37%, #e5e7eb 63%);
    background-size: 400% 100%;
    animation: skeleton-pulse 1.4s ease infinite;
    border-radius: 0.375rem;
  }
  @keyframes skeleton-pulse {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }
</style>
