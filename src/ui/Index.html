  <script>
     // URL /exec disuntik dari server. HANYA Index.html yang dievaluasi sebagai
    // template, jadi scriptlet cuma boleh ada di file ini. File yang dimuat
    // lewat include() TIDAK dievaluasi sebagai template.
    // PENTING: jangan pernah menulis sintaks scriptlet di dalam komentar.
    // Parser GAS memindai teks mentah dan tidak mengenal komentar JS.
    window.__MBTCASE_EXEC_URL__ = "<?= execUrl ?>";

    // Watchdog: kalau Alpine tidak muncul dalam 6 detik (CDN diblokir/404),
    // netralkan x-cloak dan tampilkan pesan, JANGAN biarkan layar putih.
    setTimeout(function () {
      if (!window.Alpine) document.body.classList.add('alpine-dead');
    }, 6000);
  </script>
