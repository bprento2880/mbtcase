<!-- Layar sementara Fase 1. Fase 2 menggantinya dengan daftar case + router SPA. -->
<div class="min-h-screen" x-show="!booting && view === 'home'" x-cloak>

  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2 min-w-0">
      <div class="inline-flex items-center justify-center w-8 h-8 rounded-lg shrink-0" style="background-color: var(--accent);">
        <i class="fa-solid fa-screwdriver-wrench text-white text-xs"></i>
      </div>
      <div class="min-w-0">
        <p class="text-sm font-semibold leading-tight truncate">MB T-CASE</p>
        <p class="text-[11px] text-slate-500 leading-tight truncate" x-text="user ? user.fullName : ''"></p>
      </div>
    </div>
    <button type="button" @click="logout()"
            class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1 shrink-0">
      <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i>Keluar
    </button>
  </header>

  <main class="px-4 py-6 max-w-3xl mx-auto">
    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <h2 class="text-sm font-semibold mb-3">Anda sudah masuk</h2>
      <dl class="text-sm space-y-1.5">
        <div class="flex gap-2">
          <dt class="text-slate-500 w-20 shrink-0">Nama</dt>
          <dd x-text="user ? user.fullName : '-'"></dd>
        </div>
        <div class="flex gap-2">
          <dt class="text-slate-500 w-20 shrink-0">Role</dt>
          <dd x-text="user ? user.role : '-'"></dd>
        </div>
        <div class="flex gap-2">
          <dt class="text-slate-500 w-20 shrink-0">Dealer</dt>
          <dd x-text="user && user.dealerName ? user.dealerName : '(distributor)'"></dd>
        </div>
        <div class="flex gap-2">
          <dt class="text-slate-500 w-20 shrink-0">Email</dt>
          <dd class="truncate" x-text="user ? user.email : '-'"></dd>
        </div>
      </dl>

      <p class="text-xs text-slate-500 mt-4 pt-4 border-t border-slate-100">
        Fase 1 (autentikasi &amp; RBAC) selesai. Daftar case dan pembuatan case
        masuk di Fase 2.
      </p>
    </div>
  </main>
</div>
